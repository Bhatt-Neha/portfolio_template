<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Project Details - Neha Bhatt</title>
</head>

<body>
    <!-- Same navbar as main page -->
    <nav class="navbar">
        <a href="index.html" class="logo">NehaBhatt._</a>
        <div class="nav-links">
            <a href="index.html#home">01 // about me</a>
            <a href="index.html#expertise">02 // expertise</a>
            <a href="index.html#work">03 // Projects</a>
            <a href="index.html#experience">04 // experience</a>
        </div>
    </nav>

    <main class="project-details-page">
        <div class="project-container">
            <!-- Back button -->
            <a href="index.html#projects" class="back-button">
                <i class="fas fa-arrow-left"></i> Back to Projects
            </a>

            <!-- Project Title -->
            <h1 class="project-title">Project Title</h1>

            <!-- Project Images Slider -->
            <div class="project-images">
                <div class="image-slider">
                    <!-- Images will be loaded dynamically -->
                </div>
                <div class="slider-nav">
                    <button class="prev-btn"><i class="fas fa-chevron-left"></i></button>
                    <button class="next-btn"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <!-- Project Description -->
            <div class="project-info">
                <div class="info-section">
                    <h2>Project Overview</h2>
                    <p class="project-description">
                        Project description will be loaded here.
                    </p>
                </div>

                <!-- Tech Stack -->
                <div class="info-section">
                    <h2>Technologies Used</h2>
                    <div class="tech-stack">
                        <!-- Tech stack will be loaded dynamically -->
                    </div>
                </div>

                <!-- Project Links -->
                <div class="project-links">
                   
                    <a href="#" class="project-link github-link" target="_blank">
                        <i class="fab fa-github"></i> View Code
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Add this before the closing main tag -->
    <div id="nextProjectNav"></div>

    <script src="js/project-details.js"></script>
    <script>
        // Project data
        const projects = [
            {
                id: 'cookeasy',
                title: 'CookEasy',
            },
            {
                id: 'portfolio template',
                title: 'Portfolio Template',
            }
        ];

        // Function to get current project index
        function getCurrentProjectIndex() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentProjectId = urlParams.get('id');
            return projects.findIndex(project => project.id === currentProjectId);
        }

        // Function to render next project navigation
        function renderNextProjectNav() {
            const currentIndex = getCurrentProjectIndex();
            const nextProjectNav = document.getElementById('nextProjectNav');

            // If this is the last project or invalid project, don't show navigation
            if (currentIndex === -1 || currentIndex === projects.length - 1) {
                nextProjectNav.style.display = 'none';
                return;
            }

            const nextProject = projects[currentIndex + 1];

            nextProjectNav.innerHTML = `
                <a href="project-details.html?id=${nextProject.id}" class="next-project-nav">
                    <span class="next-project-label">Next Project</span>
                    <div class="next-project-title">${nextProject.title}</div>
                    <div class="navigation-arrows">
                        <div class="nav-arrow">
                            <i class="fas fa-arrow-left"></i>
                        </div>
                        <div class="nav-arrow">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                </a>
            `;

            // Add click handlers for navigation arrows
            const arrows = nextProjectNav.querySelectorAll('.nav-arrow');
            arrows[0].addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex > 0) {
                    window.location.href = `project-details.html?id=${projects[currentIndex - 1].id}`;
                }
            });

            arrows[1].addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex < projects.length - 1) {
                    window.location.href = `project-details.html?id=${projects[currentIndex + 1].id}`;
                }
            });
        }

        // Call the function when page loads
        document.addEventListener('DOMContentLoaded', renderNextProjectNav);
    </script>
</body>

</html>
