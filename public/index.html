<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <title>Portfolio Template</title>
</head>

<body>
    <nav class="navbar">
        <a href="#" class="logo">NehaBhatt._</a>
        <div class="nav-links">
            <!-- Navigation links will be populated by template.js -->
        </div>
    </nav>

    <main>
        <section id="home" class="hero-section">
            <div class="floating-elements">
                <div class="floating-cube"></div>
                <div class="floating-cube"></div>
                <div class="floating-cube"></div>
            </div>
            <div class="hero-content">
                <h1 class="typing-text">Hi 🙋🏻‍♀️, I am</h1>
                <h2 class="main-title">YOUR_NAME</h2>
                <h5 class="subtitle">YOUR_TITLE</h5>
                <div class="contact-chips">
                    <!-- Contact chips will be populated by template.js -->
                </div>
            </div>
            <div class="scroll-indicator">
                <div class="mouse">
                    <div class="wheel"></div>
                </div>
                <div class="arrows">
                    <span></span>
                </div>
            </div>
        </section>

        <section id="expertise" class="skills-section">
            <!-- Skills section will be populated by template.js -->
        </section>

        <section id="projects" class="projects-section">
            <!-- Projects section will be populated by template.js -->
        </section>

        <!-- <section id="work" class="work-section">
           
        </section> -->

        <section id="certifications" class="certifications">
            <!-- Certifications section will be populated by template.js -->
        </section>
    </main>

    <div id="certificateModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="certificateContainer">
                <img id="certificateImage" src="" alt="Certificate" style="display: none;">
                <embed id="certificatePDF" src="" type="application/pdf" style="display: none;">
                <embed id="certificateImage" src="" type="image/jpeg/png" style="display: none;">
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/template.js"></script>
    
</body>
</html>
